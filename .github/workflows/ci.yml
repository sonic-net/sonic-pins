name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bazel-test:
    name: Bazel 8.5.1 Test Suite (Trixie amd64)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      # Allow Bazel to create nested namespaces and mount its read-only root.
      options: >-
        --cap-add=SYS_ADMIN
        --security-opt=apparmor=unconfined
        --security-opt=systempaths=unconfined
    steps:
      - name: Install runner prerequisites
        # libzmq5 supplies the libraries that Debian's libzmq.so.5 loads at
        # test time (libsodium and others); it has no RUNPATH to Bazel's copies.
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          binutils build-essential ca-certificates curl file gdb git libzmq5
          patch python3 tar unzip xz-utils zstd

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify clean lockfile baseline
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch MODULE.bazel.lock >/dev/null 2>&1; then
            echo "ERROR: MODULE.bazel.lock must not be tracked in git" >&2
            exit 1
          fi
          if [ -e MODULE.bazel.lock ]; then
            echo "ERROR: MODULE.bazel.lock must be absent at job start" >&2
            exit 1
          fi

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-trixie-amd64
          cache-version: "8.5.1"

      - name: Configure verified source mirrors and Cosmos tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/e7ee462aaa8fbd137ea2187f175506e308d81dcb/ci/source_mirrors.cfg \
            -o "$RUNNER_TEMP/source_mirrors.cfg"
          echo "c28e6882aa9ebed84fd32586112e5fbfe9684af4e4aaa9942170919a3cbd308e  $RUNNER_TEMP/source_mirrors.cfg" | sha256sum -c -
          echo "common --downloader_config=$RUNNER_TEMP/source_mirrors.cfg" >> .bazelrc

          cosmos_base="https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/e7ee462aaa8fbd137ea2187f175506e308d81dcb/ci"
          curl -fsSL "$cosmos_base/github_sources.py" -o "$RUNNER_TEMP/github_sources.py"
          curl -fsSL "$cosmos_base/github_sources/cosmos-4.0.2.json" -o "$RUNNER_TEMP/cosmos.json"
          echo "06836c38c56aa0e77e1f7adac68b6463f8f1e920e0beb000061cec5b7f5ec1f2  $RUNNER_TEMP/github_sources.py" | sha256sum -c -
          echo "1579ad34288945a28a2d77f96f4764b8910dd3d856d688971e46e63e58119af5  $RUNNER_TEMP/cosmos.json" | sha256sum -c -
          python3 -B "$RUNNER_TEMP/github_sources.py" \
            --manifest "$RUNNER_TEMP/cosmos.json" \
            --distdir "$RUNNER_TEMP/distdir" \
            --cache-dir "$RUNNER_TEMP/cosmos-cache" \
            --receipt "$RUNNER_TEMP/cosmos-receipt.json"
          echo "common --distdir=$RUNNER_TEMP/distdir" >> .bazelrc

      - name: Zero-DEB production graph audit
        shell: bash
        run: |
          set -euo pipefail
          pkg_deb_nonmanual="$(bazel query --lockfile_mode=update 'kind("pkg_deb", //... except attr("tags", "\bmanual\b", //...))')"
          test -z "$pkg_deb_nonmanual"
          pkg_deb_deps="$(bazel cquery --lockfile_mode=update 'kind("pkg_deb", deps(//... except attr("tags", "\bmanual\b", //...)))')"
          test -z "$pkg_deb_deps"
          deb_actions="$(bazel aquery --lockfile_mode=update 'mnemonic("(MakeDeb|DebPackage)", //... except attr("tags", "\bmanual\b", //...))' | grep -c '^action ' || true)"
          test "$deb_actions" -eq 0

      - name: Build and run full test suite
        shell: bash
        run: |
          set -euo pipefail
          bazel run --lockfile_mode=update //:buildifier -- --mode=check -r .
          bazel test --lockfile_mode=update //p4rt_app:runtime_package_test //...

      - name: Collect lockfile and verification receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          test -f MODULE.bazel.lock
          cp MODULE.bazel.lock artifacts/ci/MODULE.bazel.lock
          if [ -f "$RUNNER_TEMP/cosmos-receipt.json" ]; then
            cp "$RUNNER_TEMP/cosmos-receipt.json" artifacts/ci/
          fi
          bazel info > artifacts/ci/bazel-info.txt 2>&1 || true
          bazel mod graph > artifacts/ci/mod-graph.txt 2>&1 || true

      - name: Upload CI receipts and lockfile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-pins-ci-receipts
          path: artifacts/ci/
          if-no-files-found: warn
