name: P4RT Production Runtime
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  p4rt-runtime:
    name: Production runtime and original tests (amd64)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      # Allow Bazel to create nested namespaces and mount its read-only root.
      options: >-
        --cap-add=SYS_ADMIN
        --security-opt=apparmor=unconfined
        --security-opt=systempaths=unconfined
    steps:
      - name: Install runner prerequisites
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          binutils build-essential ca-certificates curl file gdb git patch
          python3 tar unzip xz-utils zstd

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify clean lockfile baseline
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch MODULE.bazel.lock >/dev/null 2>&1; then
            echo "ERROR: MODULE.bazel.lock must not be tracked in git" >&2
            exit 1
          fi
          if [ -e MODULE.bazel.lock ]; then
            echo "ERROR: MODULE.bazel.lock must be absent at job start" >&2
            exit 1
          fi

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-trixie-amd64
          cache-version: "8.5.1"

      - name: Configure verified source mirrors and Cosmos tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/e7ee462aaa8fbd137ea2187f175506e308d81dcb/ci/source_mirrors.cfg \
            -o "$RUNNER_TEMP/source_mirrors.cfg"
          echo "c28e6882aa9ebed84fd32586112e5fbfe9684af4e4aaa9942170919a3cbd308e  $RUNNER_TEMP/source_mirrors.cfg" | sha256sum -c -
          echo "common --downloader_config=$RUNNER_TEMP/source_mirrors.cfg" >> .bazelrc

          cosmos_base="https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/e7ee462aaa8fbd137ea2187f175506e308d81dcb/ci"
          curl -fsSL "$cosmos_base/github_sources.py" -o "$RUNNER_TEMP/github_sources.py"
          curl -fsSL "$cosmos_base/github_sources/cosmos-4.0.2.json" -o "$RUNNER_TEMP/cosmos.json"
          echo "06836c38c56aa0e77e1f7adac68b6463f8f1e920e0beb000061cec5b7f5ec1f2  $RUNNER_TEMP/github_sources.py" | sha256sum -c -
          echo "1579ad34288945a28a2d77f96f4764b8910dd3d856d688971e46e63e58119af5  $RUNNER_TEMP/cosmos.json" | sha256sum -c -
          python3 -B "$RUNNER_TEMP/github_sources.py" \
            --manifest "$RUNNER_TEMP/cosmos.json" \
            --distdir "$RUNNER_TEMP/distdir" \
            --cache-dir "$RUNNER_TEMP/cosmos-cache" \
            --receipt "$RUNNER_TEMP/cosmos-receipt.json"
          echo "common --distdir=$RUNNER_TEMP/distdir" >> .bazelrc

      - name: Zero-DEB runtime closure audit
        shell: bash
        run: |
          set -euo pipefail
          deb_deps="$(bazel cquery --lockfile_mode=update 'kind("pkg_deb", deps(//p4rt_app:p4rt_runtime + //p4rt_app:p4rt_runtime.debug_symbols + //p4rt_app:runtime_packages.json + //:runtime_packages.json))')"
          test -z "$deb_deps"

      - name: Build and validate P4RT runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          bazel build --lockfile_mode=update \
            //p4rt_app:p4rt_runtime \
            //p4rt_app:p4rt_runtime.debug_symbols \
            //p4rt_app:runtime_packages.json \
            //:runtime_packages.json
          bazel test --lockfile_mode=update //p4rt_app:runtime_package_test

      - name: Stage runtime outputs and receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p4rt
          if [ -f MODULE.bazel.lock ]; then
            cp MODULE.bazel.lock artifacts/p4rt/MODULE.bazel.lock
          fi
          rt_tar="$(bazel cquery --lockfile_mode=update --output=files //p4rt_app:p4rt_runtime)"
          dbg_tar="$(bazel cquery --lockfile_mode=update --output=files //p4rt_app:p4rt_runtime.debug_symbols)"
          meta_json="$(bazel cquery --lockfile_mode=update --output=files //p4rt_app:runtime_packages.json)"
          test -f "$rt_tar" && cp -L "$rt_tar" artifacts/p4rt/p4rt_runtime.tar
          test -f "$dbg_tar" && cp -L "$dbg_tar" artifacts/p4rt/p4rt_runtime.debug_symbols.tar
          test -f "$meta_json" && cp -L "$meta_json" artifacts/p4rt/runtime_packages.json
          if [ -f bazel-testlogs/p4rt_app/runtime_package_test/test.outputs/installed-packages.json ]; then
            cp -L bazel-testlogs/p4rt_app/runtime_package_test/test.outputs/installed-packages.json artifacts/p4rt/
          fi
          python3 -B - <<'PY'
          import hashlib, json, pathlib, subprocess
          out = pathlib.Path("artifacts/p4rt")
          files = {}
          for name in ("p4rt_runtime.tar", "p4rt_runtime.debug_symbols.tar", "runtime_packages.json"):
              p = out / name
              if p.is_file():
                  files[name] = {
                      "bytes": p.stat().st_size,
                      "sha256": hashlib.file_digest(p.open("rb"), "sha256").hexdigest(),
                  }
          receipt = {
              "schema": 1,
              "bazel": pathlib.Path(".bazelversion").read_text().strip(),
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "files": files,
          }
          (out / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload P4RT runtime artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-pins-p4rt-runtime
          path: artifacts/p4rt/
          if-no-files-found: warn
